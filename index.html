<!doctype html>

<html lang="en"><head><meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>ICT Midterm Exam 2026–2027</title>

<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

<style>

:root{--bg1:#e4f1ff;--bg2:#fdeaf4;--card:#fff;--ink:#2b2a4c;--line:#c9d6f5;--blue:#8ec5ff;--yel:#ffe27a;--pink:#ffb3d1;--pur:#c9b6ff;--mint:#a8ecd0;--ok:#1f9d5c;--bad:#d9546f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#1c1b3d;--bg2:#2b1d40;--card:#2d2b5a;--ink:#f6f3ff;--line:#4a4786;--ok:#5fe0a0;--bad:#ff8aa3}}

:root[data-theme="dark"]{--bg1:#1c1b3d;--bg2:#2b1d40;--card:#2d2b5a;--ink:#f6f3ff;--line:#4a4786;--ok:#5fe0a0;--bad:#ff8aa3}

*{box-sizing:border-box}html,body{margin:0}

body{font-family:Fredoka,"Comic Sans MS",system-ui,sans-serif;color:var(--ink);background:linear-gradient(160deg,var(--bg1),var(--bg2));min-height:100vh;font-size:20px}

button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}

#app{max-width:980px;margin:0 auto;padding:12px 14px 40px}

header{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--card);border-radius:22px;padding:10px 16px;margin-bottom:8px;box-shadow:0 4px 0 var(--line)}

header b{font-size:1.1em}header span{flex:1;font-weight:600;min-width:140px}

.sm{border:2px solid var(--line);background:var(--card);border-radius:14px;padding:8px 12px;min-height:44px}

.bar{height:20px;background:var(--card);border-radius:20px;border:3px solid var(--card);box-shadow:0 0 0 2px var(--line);overflow:hidden;margin-bottom:16px}

.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8ec5ff,#c9b6ff,#ffb3d1,#ffe27a);transition:width .6s}

.card{background:var(--card);border-radius:30px;padding:22px;box-shadow:0 6px 0 var(--line);text-align:center}

h1{font-size:clamp(30px,7vw,54px);margin:6px 0;line-height:1.1}h2{font-size:clamp(24px,5vw,36px);margin:4px 0 14px;line-height:1.25}

.btn{border:0;border-radius:26px;padding:16px 34px;font-size:1.3em;font-weight:700;background:var(--yel);color:#2b2a4c;box-shadow:0 6px 0 #d9b93c;min-height:60px}

.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #d9b93c}.btn.g{background:var(--mint);box-shadow:0 6px 0 #5cc79c}.btn.p{background:var(--pur);box-shadow:0 6px 0 #9d86e6}

input{font:inherit;font-size:1.2em;padding:14px 18px;border-radius:20px;border:3px solid var(--line);width:min(420px,100%);text-align:center;background:var(--card);color:var(--ink);margin:10px 0}

.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:10px 0}

@media(max-width:560px){.opts{grid-template-columns:1fr}.opt{flex-direction:row!important;justify-content:flex-start!important;min-height:92px!important}.opt .e{font-size:48px!important}}

.opt{position:relative;border:4px solid var(--line);background:var(--card);border-radius:26px;min-height:190px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:12px;transition:transform .15s,border-color .2s}

.opt:hover{transform:scale(1.03);border-color:var(--blue)}

.opt .e{font-size:76px;line-height:1}.opt b{font-size:1.1em}

.opt i{position:absolute;top:8px;left:10px;font-style:normal;background:var(--pur);color:#2b2a4c;border-radius:50%;width:30px;height:30px;font-size:16px;font-weight:700;display:grid;place-items:center}

.opt.ok{border-color:var(--ok);background:color-mix(in srgb,var(--mint) 55%,var(--card))}.opt.bad{border-color:var(--bad);animation:sh .4s}.opt.lock{pointer-events:none}

.opt.num .e{font-size:96px;font-weight:700}

.scene{font-size:80px;letter-spacing:10px}

#fb{min-height:64px;font-size:1.4em;font-weight:700;margin:8px 0}#fb.ok{color:var(--ok)}#fb.bad{color:var(--bad)}

.tick{display:inline-block;animation:pop .5s}

@keyframes sh{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

@keyframes pop{0%{transform:scale(0)}70%{transform:scale(1.4)}100%{transform:scale(1)}}

@keyframes bob{50%{transform:translateY(-14px)}}@keyframes pulse{50%{box-shadow:0 0 0 10px #ffe27a88}}

.float{position:fixed;font-size:46px;opacity:.7;animation:bob 4s ease-in-out infinite;z-index:0;pointer-events:none}

.pc{width:150px;height:120px;margin:0 auto 22px;background:#bfe0ff;border:6px solid #6b8fd6;border-radius:22px;position:relative;animation:bob 2.4s ease-in-out infinite}

.pc:after{content:"";position:absolute;left:35px;bottom:-24px;width:70px;height:14px;background:#6b8fd6;border-radius:8px}

.pc u{position:absolute;top:34px;width:18px;height:22px;background:#2b2a4c;border-radius:50%}.pc u:nth-child(1){left:36px}.pc u:nth-child(2){right:36px}

.pc s{position:absolute;left:50px;top:70px;width:34px;height:16px;border-bottom:6px solid #2b2a4c;border-radius:0 0 30px 30px}

.pc em{position:absolute;top:60px;width:20px;height:12px;background:#ffb3d1;border-radius:50%}.pc em:nth-of-type(1){left:10px}.pc em:nth-of-type(2){right:10px}

.mouse{position:relative;width:200px;height:280px;margin:10px auto;border-radius:48% 48% 45% 45%/36% 36% 64% 64%;background:radial-gradient(circle at 35% 25%,#fff,#cfd8f5 55%,#8d9ad6);box-shadow:inset -12px -16px 26px #0003,0 20px 26px #0003}

.z{position:absolute;top:3%;height:42%;border:3px solid #7b86c4;background:#eef1ff;display:grid;place-items:center;font-style:normal;color:#2b2a4c}

.zl{left:3%;width:45%;border-radius:100px 6px 6px 6px}.zr{right:3%;width:45%;border-radius:6px 100px 6px 6px}

.zw{left:41%;width:18%;top:10%;height:24%;border-radius:20px;background:#6c63ff;z-index:1;font-size:12px}

.z.hl{background:var(--yel);animation:pulse 1s infinite;border-color:#e0a400}.z.over{background:var(--mint);border-color:var(--ok);transform:scale(1.06)}

.z.ok{background:var(--mint);border-color:var(--ok)}.z s{text-decoration:none;color:var(--ok);font-size:30px}.z small{font-size:13px;font-weight:700;line-height:1}

.labs{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0}

.lab{background:var(--pink);color:#2b2a4c;border-radius:20px;padding:14px 22px;font-weight:700;font-size:1.15em;touch-action:none;cursor:grab;box-shadow:0 5px 0 #e68bb3;user-select:none;position:relative;z-index:5;transition:transform .25s}

.lab.drag{transition:none;z-index:50;cursor:grabbing;box-shadow:0 14px 20px #0004}.lab.done{display:none}

.opt.sel{border-color:var(--blue);background:color-mix(in srgb,var(--blue) 35%,var(--card));box-shadow:0 0 0 4px var(--blue)}

.pic{width:min(380px,100%);border-radius:20px;border:4px solid var(--line)}

.mi{width:130px;max-width:100%;height:auto;border-radius:18px;display:block}.mi.big{width:min(230px,70%);margin:0 auto}

@media(max-width:560px){.opt .mi,.opt .oi{width:90px}}

.oi{width:min(210px,90%);height:auto;border-radius:14px;display:block}.opt:not(:has(.e)){min-height:110px}.opt:not(:has(.e)) b{font-size:1.5em}

.opt .e:has(.oi),.opt .e:has(.mi){display:flex;flex-direction:column;align-items:center;gap:6px}

.mouse.mini{width:92px;height:128px;margin:0;box-shadow:inset -6px -8px 14px #0003,0 8px 12px #0003}.mini .z{border-width:2px}

.mt{position:relative;display:flex;align-items:center;justify-content:center;gap:clamp(36px,14vw,150px);margin:12px auto}

.mt .labs{flex-direction:column;margin:0}.mt .lab{font-size:15px;padding:10px 12px}.mt .mouse{width:160px;height:224px;margin:0}

.mt .z{touch-action:none;cursor:pointer}

.mt svg{position:absolute;left:0;top:0;width:100%;height:100%;pointer-events:none;z-index:4}

@media(max-width:480px){.card{padding:12px}}

.logo{background:#fff;border-radius:20px;padding:8px 18px;display:inline-block;margin-bottom:6px;box-shadow:0 3px 0 var(--line)}.logo img{height:76px;width:auto;display:block}

.spk{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;background:var(--yel);color:#2b2a4c;font-size:22px;cursor:pointer;vertical-align:middle;box-shadow:0 3px 0 #d9b93c;user-select:none;touch-action:manipulation}.opt .spk{position:absolute;top:8px;right:8px;width:42px;height:42px;font-size:18px;z-index:2}

.maze{display:flex;gap:24px;flex-wrap:nowrap;justify-content:center;align-items:flex-start}
.maze>div:last-child{min-width:220px;display:flex;flex-direction:column;align-items:center;gap:12px}
@media(max-width:680px){.maze{flex-wrap:wrap}.maze>div:last-child{width:100%;min-width:0}}
#fb{max-width:760px;margin:14px auto;min-height:64px;padding:8px 12px;border-radius:16px}
#fb.bad{background:color-mix(in srgb,var(--pink) 28%,var(--card))}

.board{--c:clamp(46px,13vw,76px);position:relative;display:grid;grid-template-columns:repeat(6,var(--c));border:6px solid #7cc576;border-radius:18px;overflow:hidden;background:#d9f5c9}

.cell{width:var(--c);height:var(--c);display:grid;place-items:center;font-size:calc(var(--c)*.7);line-height:1;position:relative}

.cell.p{background:#f7e7b4;border:1px solid #ecd48a}.cell.c:after{content:"🪙";position:absolute;font-size:calc(var(--c)*.5);animation:bob 1.6s infinite}

.cell.got:after{animation:none;opacity:0;transform:scale(2) translateY(-20px);transition:.5s}

.boy{position:absolute;width:var(--c);height:var(--c);display:grid;place-items:center;font-size:calc(var(--c)*.75);transition:left .35s,top .35s;z-index:3;left:calc(var(--c)*var(--x));top:calc(var(--c)*var(--y))}

.ctl{display:grid;grid-template-columns:repeat(3,72px);gap:8px;justify-content:center}.ctl button{height:72px;font-size:34px;border-radius:20px;border:0;background:var(--blue);box-shadow:0 5px 0 #5a9fe0;color:#2b2a4c}

.ctl .j{grid-column:1/4;width:auto;height:60px;font-size:22px;font-weight:700;background:var(--pur);box-shadow:0 5px 0 #9d86e6}

.seq{min-height:70px;border:4px dashed var(--line);border-radius:18px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;margin:12px 0;min-width:240px;max-width:340px}

.seq span{background:var(--yel);color:#2b2a4c;border-radius:12px;padding:4px 8px;font-size:24px;font-weight:700}

.coins{font-size:1.4em;font-weight:700}

.bal{font-size:60px;display:inline-block;animation:bob 2.5s ease-in-out infinite}.trophy{font-size:130px;animation:bob 2s infinite}

table{width:100%;border-collapse:collapse;font-size:16px;text-align:left}td,th{padding:8px;border-bottom:2px solid var(--line)}

@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style></head><body>

  if (s === -1) hero(); if (s === 18) conn = {}; if (s === 19) mazeInit(); if (s === 20) { burst(60); clap(); submit($('#sub')); } }

function qv(i) { const [q, v, o, c, num] = Q[i]; return `<div class="card"><h2>${i + 1}. ${q} <span class="spk" data-say="${esc(q)}" role="button" aria-label="Listen to the question">🔊</span></h2>${v}<div class="opts">${o.map((x, k) => `<button class="opt ${num ? 'num' : ''}" data-k="${k}"><i>${'ABC'[k]}</i><span class="spk" data-say="${esc(x[1])}" role="button" aria-label="Listen to the answer">🔊</span>${x[0] ? `<span class="e">${x[0]}</span>` : ''}<b>${x[1]}</b></button>`).join('')}</div><div id="fb"></div><div id="nx"></div></div>`; }

<div><div style="font-weight:700;margin-bottom:4px">Move using the arrows</div><div class="ctl"><span></span><button data-m="U" aria-label="Up">⬆️</button><span></span><button data-m="L" aria-label="Left">⬅️</button><button data-m="D" aria-label="Down">⬇️</button><button data-m="R" aria-label="Right">➡️</button><button class="j" data-m="J">🦘 JUMP</button></div>

// ===== maze =====

function mazeInit() { pos = [0, 0]; face = 'R'; got = new Set(); seq = []; running = false; st.mz.coins = 0; drawSeq(); setBoy(); document.querySelectorAll('.cell').forEach(c => c.classList.remove('got')); if ($('#cc')) $('#cc').textContent = 0; }

const cell = (x, y) => (x < 0 || y < 0 || x > 5 || y > 5) ? '#' : MAP[y][x];

const sleep = ms => new Promise(r => setTimeout(r, ms));

function collect(x, y) { const k = x + ',' + y; if (COINS.includes(k) && !got.has(k)) { got.add(k); st.mz.coins = got.size; document.querySelector(`.cell[data-k="${k}"]`).classList.add('got'); $('#cc').textContent = got.size; tone(880, .15, 'triangle'); tone(1175, .2, 'triangle', .12, .1); } }

async function bump(blocked, action = 'move') {
  st.mz.bumps++; running = false; bad();
  const f = $('#fb'); f.className = 'bad';
  let hint = 'That path is blocked. Look at the maze and try a different direction! 👀';
  if (blocked === '#') hint = '🌳 There is a tree in the way. Try another direction!';
  else if (blocked === 'b') hint = '🌿 There is a bush in the way. Find another path!';
  else if (blocked === 'r') hint = action === 'jump' ? '🪨 You cannot land there. Try a different direction!' : '🪨 There is a rock ahead. Add a step, face the rock, and press JUMP!';
  else if (blocked === 'edge') hint = '🧭 You are at the edge of the maze. Try going another way!';
  else if (action === 'jump') hint = '🦘 The jump path is blocked. Try another direction!';
  f.textContent = hint; save();
}

async function runSeq() { if (running || !seq.length || st.mz.locked) return; running = true; $('#fb').textContent = ''; const list = [...seq]; seq = []; drawSeq();

  for (const c of list) { await sleep(450); let nx, mid; if (c === 'J') { const [dx, dy] = DIR[face]; mid = [pos[0] + dx, pos[1] + dy]; nx = [pos[0] + 2 * dx, pos[1] + 2 * dy]; const m = cell(...mid), l = cell(...nx); if ((m === '#' || m === 'b') || !'.SH'.includes(l)) return bump((m === '#' || m === 'b') ? m : l, 'jump'); }

    else { face = c; const [dx, dy] = DIR[c]; nx = [pos[0] + dx, pos[1] + dy]; if (!'.SH'.includes(cell(...nx))) return bump((nx[0] < 0 || nx[1] < 0 || nx[0] > 5 || nx[1] > 5) ? 'edge' : cell(...nx)); }

    pos = nx; setBoy(); if (mid) collect(...mid); await sleep(250); collect(...pos);

    if (cell(...pos) === 'H') return home(); }

  running = false; $('#fb').className = ''; $('#fb').textContent = 'Keep going! Add more steps to reach the house. 🏠'; }

function home() { running = false; st.mz.locked = 1; good(); burst(70); clap(); const n = st.mz.coins;

  const pool = [...new Set([n, n + 1, n + 2, n - 1, n - 2].filter(v => v >= 0))].filter(v => v !== n).sort(() => Math.random() - .5).slice(0, 2), opts = [n, ...pool].sort(() => Math.random() - .5);

  $('#nx').innerHTML = `<h2 style="margin-top:20px">How many coins did you collect? <span class="spk" data-say="How many coins did you collect?" role="button" aria-label="Listen">🔊</span></h2><div class="opts" id="cq">${opts.map(v => `<button class="opt num" data-cq="${v}"><span class="e">${v}</span></button>`).join('')}</div>`; $('#nx').scrollIntoView({ behavior: 'smooth' }); }

// ===== events =====

const COL = { l: '#6c63ff', r: '#e8718d', w: '#1f9d5c' };

function mLines(tmp) { const box = $('#mt'); if (!box) return; const R = box.getBoundingClientRect(), pt = (el, c) => { const r = el.getBoundingClientRect(); return [r.left + (c ? r.width / 2 : r.width) - R.left, r.top + r.height / 2 - R.top]; }; let h = '';

function hero() { const im = $('#hero'); if (!im) return; if (heroURL) { im.src = heroURL; return; } if (!window.THREE) return;

  try { const T = THREE, W = 840, H = 570, r = new T.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true }); r.setSize(W, H, false); r.shadowMap.enabled = true; r.shadowMap.type = T.PCFSoftShadowMap; r.outputEncoding = T.sRGBEncoding; r.toneMapping = T.ACESFilmicToneMapping;

    soft(10, 6, -6, 8, 6, 8); soft(8, 4, 8, 4, -4, 5); soft(12, 2, 0, 10, 0, 6); sc.environment = pm.fromScene(es, .02).texture;

    const M = (c, o) => new T.MeshPhysicalMaterial(Object.assign({ color: c, roughness: .3, metalness: .1, clearcoat: 1, clearcoatRoughness: .15 }, o || {}));

    const rb = (w, h, d, rr, bv) => { const s = new T.Shape(), x = -w / 2, y = -h / 2; s.moveTo(x + rr, y); s.lineTo(x + w - rr, y); s.quadraticCurveTo(x + w, y, x + w, y + rr); s.lineTo(x + w, y + h - rr); s.quadraticCurveTo(x + w, y + h, x + w - rr, y + h); s.lineTo(x + rr, y + h); s.quadraticCurveTo(x, y + h, x, y + h - rr); s.lineTo(x, y + rr); s.quadraticCurveTo(x, y, x + rr, y); const g = new T.ExtrudeGeometry(s, { depth: d, bevelEnabled: true, bevelThickness: bv, bevelSize: bv, bevelSegments: 4, curveSegments: 12 }); g.translate(0, 0, -d / 2); return g; };

    const fl = new T.Mesh(new T.PlaneGeometry(60, 60), new T.MeshStandardMaterial({ color: 0xffe9f1, roughness: .7 })); fl.rotation.x = -Math.PI / 2; fl.receiveShadow = true; sc.add(fl);

    // screen picture

    g.fillStyle = 'rgba(255,255,255,.22)'; g.beginPath(); g.ellipse(430, 210, 290, 110, -.45, 0, 7); g.fill(); g.fillStyle = 'rgba(40,80,220,.35)'; g.beginPath(); g.ellipse(520, 270, 260, 90, -.35, 0, 7); g.fill();

    ['#ffe27a', '#ffb3d1', '#a8ecd0', '#c9b6ff'].forEach((col, i) => { g.fillStyle = col; g.beginPath(); g.arc(50, 50 + i * 68, 25, 0, 7); g.fill(); });

    g.fillStyle = '#fff'; g.font = '700 64px Fredoka,Arial,sans-serif'; g.textAlign = 'center'; g.fillText('ICT Exam', 360, 185); g.fillStyle = 'rgba(255,255,255,.8)'; g.fillRect(0, 326, 640, 34);

    const tx = new T.CanvasTexture(c); tx.encoding = T.sRGBEncoding; tx.anisotropy = 8;

    // monitor

    add(rb(3.7, 2.25, .12, .14, .05), blk, 0, 1.95, -.6); const scr = new T.Mesh(new T.PlaneGeometry(3.4, 1.9), new T.MeshBasicMaterial({ map: tx, toneMapped: false })); scr.position.set(0, 1.95, -.48); sc.add(scr);

    add(new T.BoxGeometry(.42, .9, .16), gry, 0, .5, -.8); const bs = add(new T.CylinderGeometry(.95, 1.05, .07, 64), gry, 0, .04, -.6); bs.scale.z = .6;

    add(new T.BoxGeometry(.012, .02, .36), blk, 0, .272, -.24, mg); add(new T.BoxGeometry(.4, .012, .012), blk, 0, .262, -.06, mg); const wl = add(new T.CylinderGeometry(.04, .04, .1, 24), gry, 0, .278, -.2, mg); wl.rotation.z = Math.PI / 2;

    const cable = new T.CatmullRomCurve3([new T.Vector3(2.4, .04, 1.05), new T.Vector3(2.4, .03, .4), new T.Vector3(2.0, .03, -.3), new T.Vector3(1.2, .03, -.9), new T.Vector3(.1, .03, -1.0)]); add(new T.TubeGeometry(cable, 40, .02, 8), blk, 0, 0, 0);

    sc.add(new T.HemisphereLight(0xdfe9ff, 0xffe0ee, .6)); const dl = new T.DirectionalLight(0xfff4e6, 1.7); dl.position.set(-5, 9, 7); dl.castShadow = true; dl.shadow.mapSize.set(2048, 2048); Object.assign(dl.shadow.camera, { left: -7, right: 7, top: 7, bottom: -7, near: 1, far: 30 }); dl.shadow.bias = -.0004; sc.add(dl);

    const cam = new T.PerspectiveCamera(30, W / H, .1, 60); cam.position.set(1, 3.2, 9.3); cam.lookAt(.2, 1.25, .4); r.render(sc, cam);

const lsg = k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } };

const report = p => `ICT Midterm Exam report\nStudent: ${p.name}\nDate: ${new Date(p.date).toLocaleString()}\nID: ${p.id}\nStatus: ${p.status}\nActivity 1: ${p.a1}/18\nActivity 2: ${p.a2}/1\nActivity 3: ${p.a3}/1\nTOTAL: ${p.total}/20\nMissed on first try: ${p.questions.filter(q => q.wrongTries).map(q => 'Q' + q.n).join(', ') || 'none'}\nMaze coins collected: ${p.maze.coinsCollected}`;

const mailLink = p => 'mailto:sahlaayashath@gmail.com?subject=' + encodeURIComponent('ICT Exam: ' + p.name + ' ' + p.total + '/20 (' + p.status + ')') + '&body=' + encodeURIComponent(report(p));

  app.innerHTML = `<div class="card" style="text-align:left"><h2>Teacher results (this device)</h2><p><a href="#">Back to exam</a></p><p><small>Email service web app URL (set once on each exam device):</small><br><input id="ep" style="width:100%;text-align:left" value="${esc(lsg('ict_endpoint'))}"><button class="sm" data-a="sep">Save</button> <button class="sm" data-a="sall">Send unsent results</button></p><div style="overflow-x:auto"><table><tr><th>Student</th><th>Date</th><th>Status</th><th>A1/18</th><th>A2/1</th><th>A3/1</th><th>Total/20</th><th>Missed first try</th><th></th></tr>${s.map(p => `<tr><td>${esc(p.name)}</td><td>${new Date(p.date).toLocaleString()}</td><td>${p.status}</td><td>${p.a1}</td><td>${p.a2}</td><td>${p.a3}</td><td><b>${p.total}</b></td><td>${p.questions.filter(q => q.wrongTries).map(q => 'Q' + q.n).join(', ') || '—'}</td><td><a href="${esc(mailLink(p))}">✉ Email</a></td></tr>`).join('') || '<tr><td colspan="9">No results yet.</td></tr>'}</table></div></div>`; } else render(); }
